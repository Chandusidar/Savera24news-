name: Build Android APK Installer (सवेरा 24 न्यूज़)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-apk:
    name: Build Android Package Installer (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK Installer
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Savera24News-Installer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Savera24News-Android-Installer-APK
          path: build-output/Savera24News-Installer.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: 'सवेरा 24 न्यूज़ Android App Installer'
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ### 📱 सवेरा 24 न्यूज़ - Android Package Installer (APK)
            **सच की राह सवेरा के साथ**
            
            - **App Name:** सवेरा 24 न्यूज़ (Savera 24 News)
            - **Website:** https://www.savera24news.in/
            - **Platform:** Android 7.0+ (API 24+)
            
            #### 📥 इंस्टॉल कैसे करें (How to Install):
            1. नीचे दिए गए `Savera24News-Installer.apk` लिंक पर क्लिक करके डाउनलोड करें।
            2. डाउनलोड होने के बाद फ़ाइल पर टैप करें।
            3. यदि पूछा जाए, तो **"Install from unknown sources"** की अनुमति दें।
            4. **Install** बटन दबाएं और ऐप का आनंद लें!
          files: build-output/Savera24News-Installer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
