<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="newsRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="104" fill="url(#newsRed)" />
  
  <!-- Outer Ring -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 8" opacity="0.4" />
  
  <!-- Emblem Badge -->
  <circle cx="256" cy="230" r="140" fill="#ffffff" />
  <circle cx="256" cy="230" r="130" fill="#111827" />
  
  <!-- Sunrise / Sun Rays (सवेरा - Dawn) -->
  <path d="M196 230 C 196 196 222 170 256 170 C 290 170 316 196 316 230 Z" fill="url(#goldAccent)" />
  <line x1="256" y1="140" x2="256" y2="160" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
  <line x1="200" y1="160" x2="215" y2="175" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
  <line x1="312" y1="160" x2="297" y2="175" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
  <line x1="170" y1="205" x2="190" y2="210" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
  <line x1="342" y1="205" x2="322" y2="210" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />

  <!-- 24 Typography -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">24</text>
  
  <!-- Hindi Wordmark: सवेरा -->
  <text x="256" y="325" font-family="'Noto Sans Devanagari', 'Mangal', sans-serif" font-size="28" font-weight="800" fill="#fbbf24" text-anchor="middle">सवेरा</text>
  
  <!-- Lower Strip: NEWS / न्यूज़ -->
  <rect x="96" y="400" width="320" height="52" rx="26" fill="#ffffff" />
  <text x="256" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#b91c1c" text-anchor="middle" letter-spacing="3">SAVERA 24</text>
</svg>
